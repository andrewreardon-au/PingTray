name: msix

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Unsigned package: this is the one to upload to Partner Center.
      # Pass the real Identity values from Partner Center via repo variables.
      - name: Build unsigned MSIX (Store)
        shell: powershell
        run: |
          $a = @{}
          if ($env:IDENTITY_NAME) { $a.IdentityName = $env:IDENTITY_NAME }
          if ($env:PUBLISHER) { $a.Publisher = $env:PUBLISHER }
          if ($env:PUBLISHER_DISPLAY_NAME) { $a.PublisherDisplayName = $env:PUBLISHER_DISPLAY_NAME }
          ./build-store.ps1 @a
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: PingTray-msix-store
          path: store/out/*.msix
